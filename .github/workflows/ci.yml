name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up pinned package manager
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Check types, docs, formatting, tests, builds, and packed consumers
        run: pnpm run check
      - name: Verify checks leave tracked files unchanged
        run: git diff --exit-code
